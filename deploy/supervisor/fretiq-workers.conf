stopasgroup=true
killasgroup=true

[program:fretiq-worker-campaigns]
process_name=%(program_name)s_%(process_num)02d
command=php8.4 /var/www/fretiq/artisan queue:work database --queue=campaigns --sleep=3 --tries=3 --max-time=3600
directory=/var/www/fretiq
