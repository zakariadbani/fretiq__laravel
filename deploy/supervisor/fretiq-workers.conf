[program:fretiq-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php8.4 /var/www/fretiq/artisan queue:work database --queue=default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/fretiq
user=www-data
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/fretiq/storage/logs/worker-default.log
stopwaitsecs=600
stopasgroup=true
killasgroup=true

